openapi: 3.0.3
info:
  title: API GYMETR-Membership
  version: 1.0.0
  description: |
    Servicio de planes, suscripciones y pagos de GYMETRA.

    Gestiona el catálogo de planes de membresía, las suscripciones de cada socio, los
    pagos a través de Stripe y las transiciones de estado (activar, suspender, cancelar).

    **Dos endpoints son públicos** (planes disponibles y verificación de permisos), porque
    la pantalla de planes se carga antes del login y el servicio QR necesita consultar
    permisos sin token.
  contact:
    name: Equipo GYMETRA

servers:
  - url: http://localhost:8081
    description: Desarrollo local
  - url: http://localhost:8081
    description: "Producción (sin TLS. Ver RNF-11)"

tags:
  - name: Planes
    description: Catálogo de planes de membresía
  - name: Suscripciones
    description: Membresías contratadas por cada socio
  - name: Pagos
    description: Integración con Stripe
  - name: Configuración
    description: Parámetros de la configuración de membresía
  - name: Diagnóstico
    description: Herramientas de depuración — no deben exponerse en producción

security:
  - bearerAuth: []

paths:
  /api/memberships:
    get:
      tags: [Planes]
      summary: Listar todos los planes
      operationId: listarPlanes
      security:
        - bearerAuth: []
        - adminAuth: []
      responses:
        '200':
          description: Lista de planes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Membership'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Planes]
      summary: Crear un plan
      operationId: crearPlan
      security:
        - bearerAuth: []
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipRequest'
      responses:
        '200':
          description: Plan creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/memberships/available:
    get:
      tags: [Planes]
      summary: Listar planes disponibles
      description: |
        Devuelve solo los planes con `status = 'available'`.

        **Endpoint público**: la pantalla de planes debe cargarse antes de que el socio
        inicie sesión. Aplica la regla de negocio R-MB-1.
      operationId: listarPlanesDisponibles
      security: []
      responses:
        '200':
          description: Planes contratables
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Membership'

  /api/memberships/{id}:
    parameters:
      - $ref: '#/components/parameters/MembershipId'
    get:
      tags: [Planes]
      summary: Obtener un plan
      operationId: obtenerPlan
      security:
        - bearerAuth: []
        - adminAuth: []
      responses:
        '200':
          description: Datos del plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Planes]
      summary: Actualizar un plan
      operationId: actualizarPlan
      security:
        - bearerAuth: []
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipRequest'
      responses:
        '200':
          description: Plan actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Planes]
      summary: Eliminar un plan
      operationId: eliminarPlan
      security:
        - bearerAuth: []
        - adminAuth: []
      responses:
        '200':
          description: Plan eliminado
        '404':
          $ref: '#/components/responses/NotFound'

  /api/user-memberships/all:
    get:
      tags: [Suscripciones]
      summary: Listar todas las suscripciones
      description: |
        Devuelve **todas** las suscripciones del sistema, sin paginación.

        Endpoint de administración. Sin paginación, con muchos socios la respuesta
        puede ser muy grande.
      operationId: listarTodasSuscripciones
      security:
        - bearerAuth: []
        - adminAuth: []
      responses:
        '200':
          description: Lista de suscripciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserMembership'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/user-memberships:
    post:
      tags: [Suscripciones]
      summary: Contratar una membresía
      description: |
        Crea una suscripción a un plan. Calcula `end_date` a partir de
        `start_date + membership.durationDays` y la deja en estado `PENDING` hasta que el
        pago se confirme.
      operationId: contratarMembresia
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserMembershipRequest'
      responses:
        '200':
          description: Suscripción creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMembership'
        '404':
          description: El plan no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/user-memberships/{id}/activate:
    parameters:
      - $ref: '#/components/parameters/UserMembershipId'
    put:
      tags: [Suscripciones]
      summary: Activar una suscripción
      operationId: activarSuscripcion
      security:
        - bearerAuth: []
        - adminAuth: []
      responses:
        '200':
          description: Suscripción activada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMembership'

  /api/user-memberships/{id}/suspend:
    parameters:
      - $ref: '#/components/parameters/UserMembershipId'
    put:
      tags: [Suscripciones]
      summary: Suspender una suscripción
      description: |
        Cambia el estado a `SUSPENDED`. El socio pierde el acceso al gimnasio: la
        validación de QR consulta este estado a través del servicio QR.
      operationId: suspenderSuscripcion
      security:
        - bearerAuth: []
        - adminAuth: []
      responses:
        '200':
          description: Suscripción suspendida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMembership'

  /api/user-memberships/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/UserMembershipId'
    put:
      tags: [Suscripciones]
      summary: Cancelar una suscripción
      description: |
        Cambia el estado a `CANCELED`, que es terminal. No existe un estado `DELETED`.
      operationId: cancelarSuscripcion
      security:
        - bearerAuth: []
        - adminAuth: []
      responses:
        '200':
          description: Suscripción cancelada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMembership'

  /api/user-memberships/user/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Suscripciones]
      summary: Listar las membresías de un usuario
      operationId: listarMembresiasDeUsuario
      security:
        - bearerAuth: []
        - adminAuth: []
      responses:
        '200':
          description: Membresías del usuario
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserMembership'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/user-memberships/user/{userId}/remaining-days:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Suscripciones]
      summary: Días restantes de una membresía
      description: |
        Calcula los días que le quedan al socio hasta `end_date`.

        Este endpoint **exige JWT** (a diferencia de `.../permission/*`, que es público).
      operationId: diasRestantes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Días restantes
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: integer
                    example: 1
                  remainingDays:
                    type: integer
                    example: 23
        '404':
          $ref: '#/components/responses/NotFound'

  /api/user-memberships/user/{userId}/permission/{permission}:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - name: permission
        in: path
        required: true
        description: Permiso a verificar
        schema:
          type: string
          enum: [QR_READ, TRAINING_READ, NUTRITION_READ]
          example: QR_READ
    get:
      tags: [Suscripciones]
      summary: Verificar si un usuario tiene un permiso
      description: |
        Aplica la regla **R-MB-4**: solo una suscripción en estado `ACTIVE` concede
        permisos.

        **Endpoint público.** Lo consume el servicio `GYMETRA-Qr` para validar el acceso
        al gimnasio sin propagar un token de usuario. Ver
        [ADR-006](../../../05-arquitectura/decisiones/registros/ADR-006-proxy-validacion-membresia.md).

        ⚠️ Al ser público, cualquiera que conozca la URL puede enumerar qué socios tienen
        qué permisos. Ver riesgo R-18.
      operationId: verificarPermiso
      security: []
      responses:
        '200':
          description: Resultado de la verificación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionResponse'

  /api/payments/create-payment-intent:
    post:
      tags: [Pagos]
      summary: Crear un PaymentIntent en Stripe
      description: |
        Valida que el plan esté disponible (R-MB-1), crea un `PaymentIntent` en Stripe con
        el importe del plan y registra el pago en estado `PENDING`.

        Devuelve el `client_secret` de Stripe, que el frontend usa con Stripe.js para
        completar el cobro en el navegador.
      operationId: crearPaymentIntent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentIntentRequest'
      responses:
        '200':
          description: PaymentIntent creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntentResponse'
        '400':
          description: El plan no existe o no está disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Plan no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/payments/confirm-payment:
    post:
      tags: [Pagos]
      summary: Confirmar el pago
      description: |
        **Vuelve a consultar a Stripe** (`PaymentIntent.retrieve`) para verificar el estado
        real del pago en el servidor. No confía en lo que el navegador declara.

        Si Stripe confirma el pago, marca el registro como `CONFIRMED` y activa la
        suscripción.

        ⚠️ El enum `PaymentStatus` usa los valores `PENDING`, `CONFIRMED` y `FAILED`. El
        estado equivalente en la API de Stripe es `succeeded`; no son el mismo nombre.
      operationId: confirmarPago
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPaymentRequest'
      responses:
        '200':
          description: Pago confirmado y suscripción activada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          description: Petición inválida o el pago no pudo verificarse contra Stripe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/payments/all:
    get:
      tags: [Pagos]
      summary: Listar todos los pagos
      description: |
        Devuelve **todos** los pagos, sin paginación ni filtros.

        ⚠️ Con volumen alto la respuesta puede ser muy grande. Es un endpoint de
        administración usado por el dashboard de métricas.
      operationId: listarPagos
      security:
        - bearerAuth: []
        - adminAuth: []
      responses:
        '200':
          description: Lista de pagos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/membership-config:
    get:
      tags: [Configuración]
      summary: Leer la configuración de membresía
      operationId: leerConfiguracion
      security:
        - bearerAuth: []
        - adminAuth: []
      responses:
        '200':
          description: Configuración actual
          content:
            application/json:
              schema:
                type: object
    put:
      tags: [Configuración]
      summary: Actualizar la configuración de membresía
      description: |
        ⚠️ Este par de endpoints **no tiene historia de usuario asociada** en la matriz
        de trazabilidad: es código sin requisito documentado.
      operationId: actualizarConfiguracion
      security:
        - bearerAuth: []
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Configuración actualizada

  /api/diagnostic/test-payment:
    post:
      tags: [Diagnóstico]
      summary: Probar el flujo de pago
      description: |
        ⚠️ **Herramienta de depuración.** Dispara un pago de prueba.

        Exige JWT, pero **no exige rol `Admin`**: cualquier socio autenticado puede
        invocarlo. No debe existir en un entorno desplegado. Ver riesgo R-18.
      operationId: probarPago
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Resultado de la prueba
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/diagnostic/check-table-structure:
    get:
      tags: [Diagnóstico]
      summary: Inspeccionar la estructura de una tabla
      description: |
        ⚠️ **Herramienta de depuración.** Devuelve el esquema de la tabla.

        Exige JWT, pero no exige rol `Admin`. Ver riesgo R-18.
      operationId: inspeccionarTabla
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Estructura de la tabla
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    column_name:
                      type: string
                    data_type:
                      type: string
                    is_nullable:
                      type: string
                    column_default:
                      type: string

  /api/diagnostic/simple-test:
    get:
      tags: [Diagnóstico]
      summary: Probar la conectividad del servicio
      description: |
        ⚠️ **Herramienta de depuración.** No exige rol `Admin`. Ver riesgo R-18.
      operationId: pruebaSimple
      security:
        - bearerAuth: []
      responses:
        '200':
          description: El servicio responde
          content:
            text/plain:
              schema:
                type: string

  /api/diagnostic/user-membership/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Diagnóstico]
      summary: Inspeccionar la membresía de un usuario
      description: |
        ⚠️ **Herramienta de depuración.** No exige rol `Admin`. Ver riesgo R-18.
      operationId: inspeccionarMembresia
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Datos de depuración de la membresía
          content:
            application/json:
              schema:
                type: object

  /api/diagnostic/check-user-membership-table:
    get:
      tags: [Diagnóstico]
      summary: Inspeccionar la tabla de membresías
      description: |
        ⚠️ **Herramienta de depuración.** No exige rol `Admin`. Ver riesgo R-18.
      operationId: inspeccionarTablaMembresias
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Estructura de la tabla
          content:
            application/json:
              schema:
                type: object

  /api/inspector/payment-table-structure:
    get:
      tags: [Diagnóstico]
      summary: Ver el esquema de la tabla de pagos
      description: |
        ⚠️ **Herramienta de depuración.** Expone columnas, tipos y valores por defecto de
        la tabla `payment`. No exige rol `Admin`. Ver riesgo R-18.
      operationId: inspeccionarTablaPagos
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Esquema de la tabla `payment`
          content:
            application/json:
              schema:
                type: object

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT emitido por AWS Cognito.
    adminAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        **Requiere rol `Admin`.** La implementación actual solo exige un token válido
        (`anyRequest().authenticated()`) sin comprobar el rol. Ver riesgo R-16.

  parameters:
    MembershipId:
      name: id
      in: path
      required: true
      description: Identificador del plan
      schema:
        type: integer
        format: int32
        example: 1
    UserMembershipId:
      name: id
      in: path
      required: true
      description: Identificador de la suscripción
      schema:
        type: integer
        format: int32
        example: 1
    UserId:
      name: userId
      in: path
      required: true
      description: Identificador del socio
      schema:
        type: integer
        format: int32
        example: 1

  responses:
    BadRequest:
      description: Petición malformada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Token ausente, inválido o expirado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: El recurso no existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Membership:
      type: object
      properties:
        membershipId:
          type: integer
          format: int32
          example: 1
        planName:
          type: string
          example: Mensual
        durationDays:
          type: integer
          example: 30
        price:
          type: number
          format: double
          example: 50000.00
        status:
          type: string
          enum: [available, unavailable]
          example: available
        description:
          type: string
          nullable: true
        training:
          type: boolean
          default: false
        nutrition:
          type: boolean
          default: false

    MembershipRequest:
      type: object
      required: [planName, durationDays, price, status]
      properties:
        planName:
          type: string
        durationDays:
          type: integer
        price:
          type: number
        status:
          type: string
          enum: [available, unavailable]
        description:
          type: string
        training:
          type: boolean
        nutrition:
          type: boolean

    UserMembership:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 1
        userId:
          type: integer
          format: int32
          example: 1
        membership:
          $ref: '#/components/schemas/Membership'
        startDate:
          type: string
          format: date
          example: '2026-09-20'
        endDate:
          type: string
          format: date
          example: '2026-10-20'
        status:
          type: string
          enum: [PENDING, ACTIVE, SUSPENDED, CANCELED, EXPIRED]
          example: ACTIVE
        createdAt:
          type: string
          format: date-time

    UserMembershipRequest:
      type: object
      required: [userId, membershipId]
      properties:
        userId:
          type: integer
          format: int32
        membershipId:
          type: integer
          format: int32
        startDate:
          type: string
          format: date
          description: Si se omite, se usa la fecha actual.

    Payment:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        userId:
          type: integer
          format: int32
          readOnly: true
          description: Expuesto como campo virtual (`@Transient`) para evitar cargar la relación.
        membershipId:
          type: integer
          format: int32
          readOnly: true
        amount:
          type: number
          format: double
          example: 50000.00
        paymentMethod:
          type: string
          enum: [CASH, CARD, GATEWAY]
          example: CARD
        transactionReference:
          type: string
          nullable: true
          description: Identificador del PaymentIntent en Stripe.
          example: pi_3AbCxyz
        paymentStatus:
          type: string
          enum: [PENDING, CONFIRMED, FAILED]
          example: CONFIRMED
        paymentDate:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreatePaymentIntentRequest:
      type: object
      required: [userMembershipId]
      properties:
        userMembershipId:
          type: integer
          format: int32
          description: Suscripción que se está pagando.

    PaymentIntentResponse:
      type: object
      properties:
        clientSecret:
          type: string
          description: Secreto del PaymentIntent. Lo usa Stripe.js en el navegador.
          example: pi_3AbCxyz_secret_987
        paymentId:
          type: integer
          format: int64

    ConfirmPaymentRequest:
      type: object
      required: [paymentIntentId]
      properties:
        paymentIntentId:
          type: string
          description: |
            Identificador del PaymentIntent de Stripe. El servidor lo verifica contra la
            API de Stripe; no se confía en el valor declarado por el cliente.
          example: pi_3AbCxyz
        userMembershipId:
          type: integer
          format: int32

    PermissionResponse:
      type: object
      properties:
        userId:
          type: integer
          format: int32
        permission:
          type: string
        granted:
          type: boolean
          description: |
            `true` solo si existe una suscripción en estado `ACTIVE` (regla R-MB-4).
        reason:
          type: string
          nullable: true
          description: Motivo de la denegación, si aplica.

    Error:
      type: object
      properties:
        status:
          type: integer
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: El pago no pudo verificarse
        path:
          type: string
          example: /api/payments/confirm-payment
        timestamp:
          type: string
          format: date-time
